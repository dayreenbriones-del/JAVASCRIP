<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de Salario</title>
</head>

<body>
    <h2>Calculadora de Salario</h2>
    <label>Nombre:</label><br>
    <input type="text" id="nombre" placeholder="escribe tu nombre"><br><br>
    <label>Apellido</label><br>
    <input type="text" id="apellido" placeholder="escribe tu apellido"><br><br>
    <label>Horas trabajadas:</label><br>
    <input type="numero" id="horas" placeholder="Horas trabajadas"><br><br>
    <label>Salario por hora:</label><br>
    <input type="numero" id="salarioHora" placeholder="Salario por hora"><br><br>
    
    <button onclick="calcularSalario()">Calcular</button><br><br>
    
    <label>Salario Bruto:</label><br>
    <input type="text" id="bruto"><br><br>
    <label>IVM (7%):</label><br>
    <input type="text" id="ivm"><br><br>
    <label>Renta (13%):</label><br>
    <input type="text" id="renta"><br><br>
    <label>Salario Neto:</label><br>
    <input type="text" id="neto"><br><br>

    <script src="js/codigo.js"></script>
</body>

</html>

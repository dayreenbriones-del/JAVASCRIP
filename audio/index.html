<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor de Audio</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow-lg" style="width: 400px;">
        <h3 class="text-center mb-3">🎵 Reproductor</h3>

       
        <input type="file" id="seleccionar" class="form-control mb-3" accept=".mp3,.wav">

        
        <div class="d-flex justify-content-between mb-3">
            <button id="play" class="btn btn-success">▶️ Play</button>
            <button id="pause" class="btn btn-warning">⏸️ Pause</button>
            <button id="mute" class="btn btn-secondary">🔇 Mute</button>
            <button id="loop" class="btn btn-info">🔁 Loop</button>
        </div>

        
        <label>Volumen</label>
        <input type="range" id="volumen" class="form-range" min="0" max="1" step="0.1" value="1">

      
        <label>Velocidad</label>
        <input type="range" id="velocidad" class="form-range" min="0.5" max="2" step="0.1" value="1">

    </div>

    <script src="js/codigo.js"></script>
</body>
</html>

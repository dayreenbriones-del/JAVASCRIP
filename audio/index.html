<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reproductor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card-player p-3 shadow-lg text-center">
        <div class="album-img mb-3"></div>

        <h5>DAYREEN</h5>
        <p class="text-secondary">UUU</p>

        <div class="disco-container mb-3">
            <div class="disco"></div>
        </div>


        <div class="mb-2">
            <input type="range" id="progreso" value="0" min="0" step="1" class="form-range">
        </div>


        <div class="d-flex justify-content-between text-light small mb-3">
            <span id="tiempoActual">0:00</span>
            <span id="duracion">0:00</span>
        </div>

        <input type="file" id="seleccionar" class="form-control mb-3" accept=".mp3,.wav">

        <div class="d-flex justify-content-center gap-3 controls mb-3">
            <button id="play" class="btn btn-success">▶️</button>
            <button id="pause" class="btn btn-warning">⏸️</button>
            <button id="mute" class="btn btn-secondary">🔇</button>
            <button id="loop" class="btn btn-info">🔁</button>
        </div>

        <label class="text-start w-100">Volumen</label>
        <input type="range" id="volumen" class="form-range" min="0" max="1" step="0.1" value="1">

        <label class="text-start w-100">Velocidad</label>
        <input type="range" id="velocidad" class="form-range" min="0.5" max="2" step="0.1" value="1">

    </div>

    <script src="js/codigo.js"></script>
</body>

</html>
